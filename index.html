<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>正在工作 · Token</title>
<style>
:root{color-scheme:light dark;--bg:#f1f2f0;--card:#fff;--text:#222823;--muted:#858b86;--track:#e9ede9;--green:#497557}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:13px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
main{max-width:1100px;padding:24px;margin:auto}header{display:flex;align-items:baseline;gap:16px;justify-content:space-between;margin-bottom:18px}h1,h2{font-size:16px;font-weight:600;margin:0}#count{color:var(--muted);font-size:11px;white-space:nowrap}
.card{display:grid;grid-template-columns:minmax(130px,1.3fr) repeat(2,minmax(115px,1fr)) minmax(126px,1fr) minmax(110px,1fr);gap:18px;align-items:center;padding:16px 20px;margin-bottom:8px;background:var(--card);border:0;border-radius:0;min-height:88px}
.title{display:flex;flex-direction:column;gap:6px;min-width:0}.name{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden;font-size:12px;line-height:1.4;overflow-wrap:anywhere;font-weight:550}.label,.state{font-size:9px;color:var(--muted);line-height:1.4;letter-spacing:0}.label{white-space:nowrap}.state{display:flex;gap:6px;align-items:center}
.dot{width:10px;height:10px;flex:none;border:1.5px solid var(--track);border-top-color:var(--green);border-right-color:var(--green);border-radius:50%;animation:spin 1s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.metric{display:flex;flex-direction:column;gap:7px;min-width:0}.small-value,.percent{font-size:28px;font-weight:550;letter-spacing:-.9px;font-variant-numeric:tabular-nums;white-space:nowrap;line-height:1.1}.unit{font-size:9px;color:var(--muted);margin-left:4px;font-weight:400;letter-spacing:0}.share{display:flex;align-items:center;justify-content:space-between;gap:9px}.percent small{font-size:14px;letter-spacing:0;margin-left:2px}.percent-row{display:flex;align-items:center;gap:8px}.pie{width:28px;height:28px;flex:none}
.empty{color:var(--muted);text-align:center;padding:38px 0;line-height:2}.ranking-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:28px 0 14px}.hint{font-size:10px;color:var(--muted)}#period{color:var(--muted);font-size:10px;line-height:1.6;margin:-7px 0 18px}.rank{font-size:9px;color:var(--green);letter-spacing:.7px}footer{margin-top:18px;font-size:10px;line-height:1.9;color:var(--muted)}#health{color:var(--green)}
@media(max-width:900px){main{padding:18px 14px}.card{grid-template-columns:1fr 1fr 1.1fr 1fr;gap:12px;padding:14px 16px}.title{grid-column:1/-1;flex-direction:row;align-items:baseline;justify-content:space-between;gap:14px}.state{flex:none}.small-value,.percent{font-size:24px}.unit{display:block;margin:3px 0 0}.pie{width:24px;height:24px}.share{gap:6px}}
@media(max-width:540px){main{padding:16px 10px}.card{padding:14px;gap:16px 24px;grid-template-columns:1fr 1fr}.small-value,.percent{font-size:21px}.unit{display:block;margin:3px 0 0}.pie{width:21px;height:21px}.percent-row{gap:5px}.label{font-size:8px}.share{align-self:start}.name{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden;font-size:11px}}
@media(prefers-color-scheme:dark){:root{--bg:#191d1a;--card:#242a25;--text:#e5eae6;--muted:#97a399;--track:#364038;--green:#9abb9e}}
@media(prefers-reduced-motion:reduce){.dot{animation:none}}
.cycle-switch{display:flex;gap:6px;margin:0 0 18px}.cycle-switch button{border:1px solid var(--track);border-radius:0;padding:7px 14px;background:var(--card);color:var(--text);cursor:pointer}.cycle-switch button[aria-pressed="true"]{background:var(--green);color:var(--bg)}</style><main><header><h1>正在工作的项目</h1><span id="count">连接中</span></header><nav class="cycle-switch" aria-label="统计周期"><button data-period="current" aria-pressed="true">本周期</button><button data-period="previous" aria-pressed="false">上周期</button></nav><div id="period">读取统计周期…</div><section id="tasks" aria-live="polite"></section><div class="ranking-head"><h2>Token 占比排行</h2><span class="hint">其他任务 · 前五名</span></div><section id="ranking" aria-live="polite"></section><footer><div id="health">正在连接本机统计…</div><div id="basis">当前账户周期 · 本机已用 token 占比，非订阅额度占比</div><div>包含缓存输入 · 进行中含等待工具或确认</div></footer></main>
<script>
const box=document.querySelector('#tasks'),count=document.querySelector('#count'),health=document.querySelector('#health');
function format(n){if(n==null)return '—';return n>=1e8?(n/1e8).toFixed(1)+'亿':n>=1e4?(n/1e4).toFixed(1)+'万':n.toLocaleString('zh-CN')}
function el(tag,cls,text){const n=document.createElement(tag);n.className=cls;if(text!==undefined)n.textContent=text;return n}
function metric(label,value,cls=''){const n=el('div','metric '+cls);n.append(el('div','label',label));const v=el('div','small-value',format(value));if(value!=null)v.append(el('span','unit','token'));n.append(v);return n}
function pie(percent){const ns='http://www.w3.org/2000/svg';const svg=document.createElementNS(ns,'svg');svg.setAttribute('viewBox','0 0 44 44');svg.setAttribute('class','pie');svg.setAttribute('role','img');svg.setAttribute('aria-label',percent==null?'周期占比暂无数据':`占本周期已用 token ${percent.toFixed(1)}%`);const bg=document.createElementNS(ns,'circle');for(const [k,v] of Object.entries({cx:22,cy:22,r:21,fill:'var(--track)'}))bg.setAttribute(k,v);svg.append(bg);if(percent>0){const p=Math.min(percent,100);if(p>=100){bg.setAttribute('fill','var(--green)')}else{const a=2*Math.PI*p/100,x=22+21*Math.sin(a),y=22-21*Math.cos(a);const path=document.createElementNS(ns,'path');path.setAttribute('d',`M22 22 L22 1 A21 21 0 ${p>50?1:0} 1 ${x} ${y} Z`);path.setAttribute('fill','var(--green)');svg.append(path)}}return svg}
let previous='',selectedPeriod='current',timer,sequence=0;
const periodName=()=>selectedPeriod==='previous'?'上周期':'本周期';
function cardFor(t,rank){const card=el('article','card');const title=el('div','title');const state=el('div','state');if(rank)state.append(el('span','rank',String(rank).padStart(2,'0')+' / '+periodName()));else state.append(el('span','dot'),document.createTextNode('进行中'));title.append(el('div','name',t.title),state);const share=el('div','share');const number=el('div','metric');number.append(el('div','label',periodName()+' token 占比'));const pct=el('div','percent',t.period_percent==null?'—':t.period_percent.toFixed(1));if(t.period_percent!=null)pct.append(el('small','','%'));const percentRow=el('div','percent-row');percentRow.append(pie(t.period_percent),pct);number.append(percentRow);share.append(number);share.title='本任务本周期 token ÷ 本机可读取任务本周期 token（非订阅额度）';const usage=metric('累计用量',t.tokens);usage.title=selectedPeriod==='previous'?'截至上周期结束的累计 token':'任务开始至今的全部累计 token';const periodUsage=metric(periodName()+'用量',t.period_tokens);periodUsage.title='当前统计周期内已用 token；排行按此数值排序';card.append(title,usage,periodUsage,share,metric(selectedPeriod==='previous'?'周期内最后一轮':'上一轮对话',t.previous_turn_tokens,'previous'));return card}
function render(data){document.body.dataset.demo=data.demo?'true':'false';document.querySelector('h1').textContent=selectedPeriod==='previous'?'上周期用量':'正在工作的项目';box.hidden=selectedPeriod==='previous';count.hidden=selectedPeriod==='previous';document.querySelector('.hint').textContent=selectedPeriod==='previous'?'全部任务 · 前五名':'其他任务 · 前五名';document.querySelector('#basis').textContent='所选账户周期 · 本机已用 token 占比，非订阅额度占比';const key=JSON.stringify([data.tasks,data.ranking,data.cycle]);count.textContent=data.tasks.length+' 个进行中';if(key===previous)return;previous=key;const ranks=document.querySelector('#ranking');box.replaceChildren();ranks.replaceChildren();if(!data.tasks.length)box.append(el('div','empty','当前无进行中的任务'));for(const t of data.tasks)box.append(cardFor(t));if(!data.ranking?.length)ranks.append(el('div','empty',data.warning?'排行暂不可用':periodName()+'暂无已用 token 的任务'));for(const [i,t] of (data.ranking||[]).entries())ranks.append(cardFor(t,i+1));const fmt=n=>new Date(n*1000).toLocaleString('zh-CN',{timeZone:'Asia/Shanghai',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false});document.querySelector('#period').textContent=data.cycle?periodName()+' '+fmt(data.cycle.start)+' — '+fmt(data.cycle.end)+' · 北京时间':'当前周期尚未取得'}
async function tick(){const id=++sequence;clearTimeout(timer);try{const r=await fetch('/api/status?period='+selectedPeriod,{cache:'no-store'}),d=await r.json();if(id!==sequence)return;if(!r.ok)throw new Error();render(d);health.textContent=d.warning||(d.demo?'DEMO · Fictional data / 全部为演示数据':'本地自动更新 · 不调用 AI');}catch(e){if(id!==sequence)return;health.textContent='统计暂不可用，请检查本地服务';}finally{if(id===sequence)timer=setTimeout(tick,3000)}}
for(const button of document.querySelectorAll('[data-period]'))button.addEventListener('click',()=>{selectedPeriod=button.dataset.period;previous='';for(const b of document.querySelectorAll('[data-period]'))b.setAttribute('aria-pressed',String(b===button));box.replaceChildren();document.querySelector('#ranking').replaceChildren();health.textContent='正在读取'+periodName()+'…';tick()});tick();
</script></html>
